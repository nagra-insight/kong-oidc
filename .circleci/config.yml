##############################################################
#                                                            #
#                   DO NOT EDIT THIS FILE!                   #
#       it is generated from .circleci/config.tpl.yml        #
#                                                            #
##############################################################

version: 2.1

references:
  workspace_root: &workspace_root
    /tmp/ni-workspace

  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

  persist_to_workspace: &persist_to_workspace
    persist_to_workspace:
      root: *workspace_root
      paths:
        - .

  ###################################
  # Install packages

  install_luarocks: &install_luarocks
    run:
      name: install luarocks
      command: |
        LUA_VERSION="5.3.5"
        LUAROCKS_VERSION="3.8.0"
        sudo apt-get update
        sudo apt-get install build-essential libreadline-dev unzip

        # install lua
        curl -R -O http://www.lua.org/ftp/lua-$LUA_VERSION.tar.gz
        tar -zxf lua-$LUA_VERSION.tar.gz
        cd lua-$LUA_VERSION
        make linux test
        sudo make install
        cd -

        # install luarocks
        wget https://luarocks.org/releases/luarocks-$LUAROCKS_VERSION.tar.gz
        tar zxpf luarocks-$LUAROCKS_VERSION.tar.gz
        cd luarocks-$LUAROCKS_VERSION
        ./configure --with-lua-include=/usr/local/include
        make
        sudo make install
        cd -

executors:
  default:
    docker:
      - image: cimg/base:stable
    working_directory: *workspace_root
    resource_class: small

jobs:
  setup_workspace:
    executor: default
    steps:
      - checkout
      - run:
          name: checkout ci-tools repo
          command: |
            # add github key
            mkdir -p ~/.ssh
            ssh-keyscan -t rsa github.com > ~/.ssh/known_hosts

            # clone and install ci-tools (if not already persisted in the workspace)
            if [ ! -d ./ci-tools ]; then
              git clone git@github.com:nagra-insight/ci-tools.git
            fi
            
            echo export CI_RESOURCES=./ci-tools/circleci/resources >> $BASH_ENV
      - run:
          name: checks that the CircleCI config file is up-to-date with the version in ci-tools
          command: |
            # install gomplate if needed
            VERSION="v3.5.0"
            if [ ! -f /usr/local/bin/gomplate ]; then
              # use wget with retries because of intermittent failures in downloading gomplate
              wget --tries 10 -O /tmp/gomplate https://github.com/hairyhenderson/gomplate/releases/download/$VERSION/gomplate_linux-amd64-slim
              chmod +x /tmp/gomplate
              sudo mv /tmp/gomplate /usr/local/bin/gomplate
            fi

            # diff the committed circleci config with the freshly generated one
            diffs=$(diff .circleci/config.yml <(./ci-tools/circleci/build_config.sh))
            if [ ! -z "$diffs" ]; then
              echo $diff
              echo "The CircleCI config in ~/.circleci/config.yml is outdated. Please update it by running `./ci-tools/circleci/build_config.sh -o .circleci/config.yml` from the root of the repo"
              exit 1
            fi
      - *persist_to_workspace

  test:
    executor: default
    steps:
      - *attach_workspace
      - run:
          name: check that the version in rockspec file has been updated
          command: make check-release

  build:
    executor: default
    steps:
      - *attach_workspace
      - *install_luarocks
      - run: make build
      - *persist_to_workspace

  release:
    executor: default
    steps:
      - *attach_workspace
      - run:
          name: install jq 1.6
          command: |
            # install jq
            curl -L -o /tmp/jq https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64
            chmod +x /tmp/jq
            sudo mv /tmp/jq /usr/local/bin/
      - run:
          name: install Github CLI (gh)
          command: |
            GH_VERSION="2.0.0"
            curl -L -o /tmp/gh.tgz https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz
            tar -xz -C /tmp -f /tmp/gh.tgz
            sudo mv /tmp/gh_${GH_VERSION}_linux_amd64/bin/gh /usr/local/bin/
      - run: make release

workflows:
  version: 2
  main:
    jobs:
      - setup_workspace
      - test:
          requires:
            - setup_workspace
      - build:
          requires:
            - test
      - release:
          requires:
            - build
          filters:
            branches:
              only: master
